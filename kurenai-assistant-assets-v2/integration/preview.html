<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurenai Assistant V1 Preview</title><link rel="stylesheet" href="./assistant-visual.css"><style>body{margin:0;background:#071522;color:#eef4fa;font:16px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,700px);border:1px solid #17354d;border-radius:24px;background:linear-gradient(180deg,#0a1b2b,#07131f);padding:24px;box-shadow:0 25px 80px #0008}.stage{height:520px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.controls button{background:#102a40;color:#eaf3fa;border:1px solid #24506e;border-radius:999px;padding:9px 14px;cursor:pointer}.status{margin:12px 0 0;color:#a7bac9}</style></head><body><main class="card"><img src="../assets/assistant/logo/whispering-bloom-full.svg" alt="Kurenai Assistant" style="max-width:440px;width:80%"><div id="visual" class="kurenai-visual stage"><img data-kurenai-overlay class="kurenai-visual__overlay" alt="" hidden><img data-kurenai-mascot class="kurenai-visual__mascot" alt=""><p data-kurenai-status class="status" aria-live="polite"></p></div><div class="controls"></div></main><script type="module">import {AssistantVisualController,ASSISTANT_VISUAL_STATES} from './assistant-visual.js';const manifest=await fetch('../assets/assistant/manifest.json').then(r=>r.json());const root=document.querySelector('#visual');const controller=new AssistantVisualController(root,manifest);const controls=document.querySelector('.controls');for(const state of ASSISTANT_VISUAL_STATES){const b=document.createElement('button');b.textContent=state;b.onclick=()=>controller.setState(state,{label:state[0].toUpperCase()+state.slice(1),detail:state==='working'?'Generating flashcards':''});controls.append(b)}</script></body></html>
